<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch phòng — Phòng Thu Tím</title>
<meta name="description" content="Phần mềm quản trị phòng thu Phòng Thu Tím: lịch phòng kiểu bàn dựng nhạc kéo-thả, dự án và danh sách track, chi phí, sổ đặt phòng.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23160E25'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23B56CFF' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23FF4FD8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Unbounded:wght@400..800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('ptt-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--fd:'Unbounded',system-ui,sans-serif;--fm:'Space Mono',ui-monospace,monospace;--tb:64px;--ease:cubic-bezier(.2,.8,.2,1);--r:14px;--hdr:132px;--lane:100px}
[data-theme=dark]{--bg:#0B0613;--bg2:#120A1F;--pn:#160E25;--pn2:#1D1430;--pn3:#2A1C42;--ink:#F3EDFF;--mut:#C7B9E2;--dim:#A797C6;--ln:rgba(190,160,255,.13);--ln2:rgba(190,160,255,.26);--acc:#B56CFF;--accI:#14061F;--acc2:#FF4FD8;--cy:#3DF2E0;--li:#C8FF4D;--bad:#FF6B88;--badS:rgba(255,95,126,.16);--ok:#5CF2A8;--lcd:#06030B;--lcdI:#3DF2E0;--r0:#B56CFF;--r1:#FF4FD8;--r2:#3DF2E0;--r3:#C8FF4D;--glo:.55;--shadow:0 20px 44px -26px rgba(0,0,0,.95);--back:rgba(5,2,10,.66);--grid:rgba(190,160,255,.07);color-scheme:dark}
[data-theme=light]{--bg:#F4F0FB;--bg2:#ECE4F8;--pn:#FFFFFF;--pn2:#F7F3FD;--pn3:#EBE2F9;--ink:#1A0F2E;--mut:#4A3E63;--dim:#605476;--ln:rgba(60,30,110,.13);--ln2:rgba(60,30,110,.24);--acc:#6A21D6;--accI:#FFFFFF;--acc2:#B3128A;--cy:#077A73;--li:#4F6E00;--bad:#C4173B;--badS:rgba(196,23,59,.09);--ok:#11804F;--lcd:#1B1030;--lcdI:#7DF5EA;--r0:#6A21D6;--r1:#B3128A;--r2:#077A73;--r3:#557500;--glo:0;--shadow:0 16px 36px -24px rgba(50,20,100,.32);--back:rgba(26,15,46,.42);--grid:rgba(60,30,110,.07);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 13px/1.55 var(--fm);overflow-x:clip;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 420px at 88% -8%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),radial-gradient(700px 380px at -6% 105%,color-mix(in srgb,var(--acc2) 10%,transparent),transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);line-height:1.2;margin:0;font-weight:700}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:700 12px/1 var(--fm);padding:3px 5px;border-radius:5px;border:1px solid var(--ln2);background:var(--pn2);color:var(--mut);white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ===== transport bar ===== */
.tb{position:sticky;top:0;z-index:40;height:var(--tb);display:flex;align-items:center;gap:12px;padding:0 18px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand b{font:800 14px/1.15 var(--fd);letter-spacing:-.01em;display:block}
.brand small{font:400 12px/1.2 var(--fm);color:var(--dim);letter-spacing:.06em;display:block}
.logo{width:36px;height:36px;border-radius:10px;background:var(--pn3);display:grid;place-items:center;box-shadow:0 0 18px -4px color-mix(in srgb,var(--acc) calc(var(--glo)*100%),transparent)}
.pads{display:flex;gap:6px;flex:none}
.pad{position:relative;display:flex;align-items:center;gap:9px;height:44px;padding:0 14px 0 11px;border-radius:11px;border:1px solid var(--ln);background:var(--pn);color:var(--mut);font:600 12px/1.2 var(--fd);text-decoration:none;transition:border-color .2s,background-color .2s,color .2s}
.pad:hover{color:var(--ink);border-color:var(--ln2)}
.pad .led{width:7px;height:7px;border-radius:50%;background:var(--ln2);flex:none}
.pad .n{font:400 12px var(--fm);color:var(--dim)}
.pad[aria-current=page]{color:var(--ink);border-color:color-mix(in srgb,var(--acc) 70%,transparent);background:color-mix(in srgb,var(--acc) 15%,var(--pn))}
.pad[aria-current=page] .led{background:var(--acc2);box-shadow:0 0 9px var(--acc2)}
.lcd{flex:1;min-width:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:11px;background:var(--lcd);color:var(--lcdI);font:700 12px/1.3 var(--fm);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 3px 10px rgba(0,0,0,.6)}
.lcd .sep{opacity:.4}
.lcd .t{font-size:15px;text-shadow:0 0 10px color-mix(in srgb,var(--lcdI) 60%,transparent)}
.lcd .rec{color:#FF7AD9}
.tools{display:flex;align-items:center;gap:6px;flex:none}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--ln);background:var(--pn);color:var(--mut);position:relative}
.ib:hover{color:var(--ink);border-color:var(--ln2)}
.ib .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 2px var(--pn)}
.srch{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px 0 12px;border-radius:11px;border:1px solid var(--ln);background:var(--pn);color:var(--dim);font-size:12px}
.srch:hover{border-color:var(--ln2);color:var(--mut)}
.ava{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 5px;border-radius:11px;border:1px solid var(--ln);background:var(--pn);text-align:left}
.ava i{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--fd);font-style:normal;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.ava b{display:block;font:600 12px/1.2 var(--fd)}
.ava small{display:block;font-size:12px;color:var(--dim);line-height:1.3}
.burger{display:none}
/* ===== main ===== */
.main{max-width:1720px;margin:0 auto;padding:18px 22px 28px}
.view{display:none}
.view.on{display:block}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 18px;flex-wrap:wrap;margin-bottom:14px}
.crumb{font:400 12px var(--fm);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.crumb b{color:var(--acc2);font-weight:700}
.vh h1{font-size:23px;margin-top:4px;letter-spacing:-.01em}
.vh h1 em{font-style:normal;color:var(--acc)}
.vtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 15px;border-radius:10px;border:1px solid var(--ln2);background:var(--pn);color:var(--ink);font:600 12px/1.2 var(--fd);white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accI);box-shadow:0 8px 24px -10px color-mix(in srgb,var(--acc) calc(var(--glo)*160%),transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.sm{min-height:36px;padding:0 11px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;padding:3px;border-radius:11px;border:1px solid var(--ln);background:var(--pn)}
.seg button{min-height:34px;padding:0 12px;border-radius:8px;font:600 12px var(--fd);color:var(--mut);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--pn3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ln2)}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--shadow)}
.ph2{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 0}
.ph2 h2{font-size:13px;letter-spacing:.01em}
.ph2 small{color:var(--dim);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:16px;height:10px;border-radius:3px;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 22%,transparent)}
.legend i.gc{border-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--acc) 30%,transparent) 0 3px,transparent 3px 6px)}
.legend i.xong{border-color:var(--ln2);background:var(--pn3)}
/* ===== calendar (arrangement) ===== */
.cal{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:16px;align-items:start}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(70px,1fr);gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:8px;scrollbar-width:thin}
.day{display:flex;flex-direction:column;gap:5px;padding:8px 8px 7px;border-radius:10px;border:1px solid var(--ln);background:var(--pn);text-align:left;min-width:0;position:relative}
.day .dl{display:flex;justify-content:space-between;gap:4px;font:700 12px/1.2 var(--fm);color:var(--mut);white-space:nowrap}
.day .dl em{font-style:normal;color:var(--dim);font-weight:400}
.day svg{width:100%;height:26px;display:block}
.day .oc{height:3px;border-radius:2px;background:var(--pn3);overflow:hidden}
.day .oc i{display:block;height:100%;background:var(--acc)}
.day.past{opacity:.78}
.day.today .dl{color:var(--acc2)}
.day[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--pn));opacity:1}
.arrp{overflow:hidden;position:relative}
.arr{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;position:relative}
.arr-in{position:relative;--pph:50px}
.ruler{display:flex;height:34px;border-bottom:1px solid var(--ln);background:var(--pn2);position:relative}
.rc{position:sticky;left:0;z-index:6;width:var(--hdr);flex:none;background:var(--pn2);border-right:1px solid var(--ln);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--dim);letter-spacing:.08em}
.rt{position:relative;flex:1}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--ln);font-size:12px;color:var(--dim);padding:9px 0 0 5px;white-space:nowrap}
.tick.maj{color:var(--mut);font-weight:700}
.phl{position:absolute;top:6px;z-index:3;transform:translateX(-50%);padding:2px 7px;border-radius:6px;background:var(--acc2);color:#14061F;font:700 12px/1.3 var(--fm);white-space:nowrap;box-shadow:0 0 14px -2px color-mix(in srgb,var(--acc2) calc(var(--glo)*160%),transparent)}
.lanes{position:relative}
.lane{display:flex;height:var(--lane);border-bottom:1px solid var(--ln)}
.lane:last-child{border-bottom:0}
.lh{position:sticky;left:0;z-index:6;width:var(--hdr);flex:none;background:var(--pn);border-right:1px solid var(--ln);padding:10px 10px 10px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.lh::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) calc(var(--glo)*100%),transparent)}
.lh b{font:700 12px/1.3 var(--fd);white-space:nowrap}
.lh small{font-size:12px;color:var(--dim);line-height:1.35}
.lh .lst{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap}
.lh .lst.on{color:var(--c)}
.vu{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.vu i{width:3px;height:100%;background:var(--c);border-radius:1px;transform-origin:bottom;animation:vu 0.9s ease-in-out infinite alternate}
.vu i:nth-child(2){animation-duration:.7s;animation-delay:-.3s}.vu i:nth-child(3){animation-duration:1.1s;animation-delay:-.6s}.vu i:nth-child(4){animation-duration:.6s;animation-delay:-.2s}
@keyframes vu{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.st .vu i,.rm .vu i{animation:none;transform:scaleY(.7)}
.st .vu i:nth-child(odd),.rm .vu i:nth-child(odd){transform:scaleY(.45)}
.lt{flex:1;position:relative;background-image:linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--pph) 100%}
.clips{position:absolute;top:0;bottom:0;left:var(--hdr);right:0}
.pt-pastz{position:absolute;top:0;bottom:0;left:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--ink) 5%,transparent) 9px 10px)}
.phx{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;z-index:1;background:var(--acc2);box-shadow:0 0 12px color-mix(in srgb,var(--acc2) calc(var(--glo)*160%),transparent);pointer-events:none}
.clip{position:absolute;z-index:2;border-radius:9px;background:color-mix(in srgb,var(--c) 15%,var(--pn));border:1px solid color-mix(in srgb,var(--c) 62%,transparent);color:var(--ink);overflow:hidden;cursor:grab;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;transition:box-shadow .2s,background-color .2s,border-color .2s}
.clip:hover{border-color:var(--c)}
.clip .ch{display:flex;align-items:center;gap:5px;padding:7px 9px 0;font:600 12px/1.35 var(--fd);white-space:nowrap;min-height:22px}
.clip .ct{display:flex;align-items:center;gap:5px;padding:1px 9px 0;font-size:12px;line-height:1.35;color:var(--mut);white-space:nowrap}
.clip .cp{padding:0 9px;font-size:12px;line-height:1.35;color:var(--c);white-space:nowrap}
.clip .wv{flex:1;min-height:8px;width:100%;color:var(--c);opacity:.5;margin-top:2px}
.clip .wv path{fill:currentColor}
.clip .rz{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize}
.clip .rz::after{content:'';position:absolute;right:3px;top:50%;width:2px;height:18px;margin-top:-9px;border-radius:2px;background:var(--c);opacity:.6}
.clip.gc{border-style:dashed;background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 13%,transparent) 0 6px,transparent 6px 12px)}
.clip.xong{background:var(--pn2);border-color:var(--ln2);cursor:pointer}
.clip.xong .wv{color:var(--dim);opacity:.35}
.clip.xong .cp{color:var(--mut)}
.clip .ok{font-style:normal;color:var(--ok);font-family:var(--fm);font-weight:700}
.clip .rec{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);flex:none}
.clip.dang{cursor:pointer;box-shadow:0 0 0 1px var(--c),0 0 24px -6px color-mix(in srgb,var(--c) calc(var(--glo)*180%),transparent)}
.clip.sel{box-shadow:0 0 0 2px var(--ink),0 10px 26px -10px rgba(0,0,0,.6);z-index:4}
.clip.sel{touch-action:none}
.clip.pt-drag{cursor:grabbing;z-index:7;opacity:.95;box-shadow:0 0 0 2px var(--cy),0 16px 36px -12px rgba(0,0,0,.7)}
.clip.pt-clash{border-color:var(--bad);background:var(--badS);box-shadow:0 0 0 2px var(--bad)}
.pt-ghost{position:absolute;z-index:3;border-radius:9px;border:1.5px dashed var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);font:700 12px/1.3 var(--fm);color:var(--ink);padding:7px 9px;white-space:nowrap;overflow:hidden;pointer-events:none}
.pt-ghost.bad{border-color:var(--bad);background:var(--badS)}
.arr-hint{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--ln);font-size:12px;color:var(--dim)}
.arr-hint .kb{white-space:nowrap}
.scroll-hint{display:none}
/* inspector */
.insp{position:sticky;top:calc(var(--tb) + 16px);display:flex;flex-direction:column;gap:12px}
.isec{padding:14px 16px}
.ish{font:700 12px/1.3 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.live{display:flex;flex-direction:column;gap:8px}
.lv{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,var(--pn2));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);text-align:left;width:100%}
.lv b{font:600 12px/1.3 var(--fd);grid-column:2}
.lv small{grid-column:2;font-size:12px;color:var(--mut)}
.lv .vu{grid-row:1/3}
.lv .pg{grid-column:1/-1;height:3px;border-radius:2px;background:var(--pn3);margin-top:6px;overflow:hidden}
.lv .pg i{display:block;height:100%;background:var(--c)}
.lv em{grid-row:1/3;grid-column:3;font-style:normal;font-size:12px;color:var(--c);font-weight:700}
.nx{display:flex;flex-direction:column}
.nx button{display:grid;grid-template-columns:52px 1fr;gap:2px 8px;padding:8px 0;border-top:1px dashed var(--ln);text-align:left}
.nx button:first-child{border-top:0}
.nx time{font-weight:700;color:var(--c);grid-row:1/3}
.nx b{font:600 12px/1.35 var(--fd)}
.nx small{color:var(--dim);font-size:12px}
.empty-s{color:var(--mut);font-size:12px;margin:0}
.rates{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12px}
.rates span{display:flex;align-items:center;gap:7px}
.rates span::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--c)}
.rates b{text-align:right}
.rates p{grid-column:1/-1;margin:4px 0 0;color:var(--dim);font-size:12px}
.is-sel{padding:0;overflow:hidden}
.is-h{padding:14px 16px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,transparent),transparent);border-bottom:1px solid var(--ln)}
.is-top{display:flex;align-items:center;gap:8px}
.is-top .code{font-size:12px;color:var(--dim);margin-right:auto}
.is-top .ib{width:36px;height:36px}
.is-h h2{font-size:17px;margin-top:8px}
.is-sub{margin:3px 0 0;font-size:12px;color:var(--mut)}
.lnk{color:var(--c);text-decoration:underline;text-underline-offset:3px;font-size:12px;text-align:left}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font:700 12px/1.5 var(--fm);letter-spacing:.03em;white-space:nowrap;border:1px solid currentColor}
.st-xn{color:var(--acc)}.st-gc{color:var(--acc2)}.st-dang{color:var(--bad)}.st-xong{color:var(--ok)}.st-huy{color:var(--dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;padding:12px 16px;font-size:12px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;text-align:right}
.nudge{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 16px 12px}
.nudge button{min-height:40px;border-radius:9px;border:1px solid var(--ln);background:var(--pn2);font-size:12px;color:var(--mut)}
.nudge button:hover{color:var(--ink);border-color:var(--c)}
.nudge p{grid-column:1/-1;margin:0 0 2px;font-size:12px;color:var(--dim)}
.lock{margin:0 16px 12px;padding:9px 11px;border-radius:9px;background:var(--pn2);font-size:12px;color:var(--mut)}
.bill{margin:0 16px;padding:10px 0;border-top:1px dashed var(--ln2);display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px}
.bill span{color:var(--mut)}
.bill b{text-align:right;font-weight:400}
.bill .tot{font:700 14px var(--fm);color:var(--ink)}
.bill .tot+b{font:700 14px var(--fm);color:var(--c)}
.is-act{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 16px}

/* pointer + keyboard on the arrangement */
let drag = null, swallowClick = false
function bindArr(arr) {
  arr.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return

    if (clipEl) {
      const b = byId(clipEl.dataset.id)

      if (e.pointerType !== 'mouse' && cal.sel !== b.id) return
      drag = { mode: e.target.classList.contains('rz') ? 'rz' : 'mv', b, el: clipEl, x0: e.clientX, y0: e.clientY, s: b.s, room: b.room, dur: b.dur, on: false }

      drag = { mode: 'new', x0: e.clientX, y0: e.clientY, h0: Math.floor(h * 2) / 2, h1: Math.floor(h * 2) / 2 + 0.5, room, on: false, touch: e.pointerType !== 'mouse' }

    const map = { ArrowLeft: e.shiftKey ? 'd-' : 's-', ArrowRight: e.shiftKey ? 'd+' : 's+', ArrowUp: 'r-', ArrowDown: 'r+' }

  })
}

  cmd.forEach((c) => { if (!f || fold(c[0]).includes(f)) out.push({ g: 'Lệnh', t: c[0], s: c[1], fn: c[2] }) })
  if (f) {
    PROJ.forEach((p) => { if (fold(p.t + ' ' + p.a).includes(f)) out.push({ g: 'Dự án', t: p.t + ' — ' + p.a, s: p.type, fn: () => { projSel = p.i; location.hash === '#du-an' ? renderProj() : (location.hash = 'du-an') } }) })
    PROJ.forEach((p) => p.tracks.forEach((t) => { if (fold(t.n).includes(f)) out.push({ g: 'Track', t: t.n, s: p.t, fn: () => { projSel = p.i; location.hash === '#du-an' ? renderProj() : (location.hash = 'du-an') } }) }))
    BK.filter((b) => b.d >= -14 && b.d <= 14 && b.st !== 'huy' && fold(b.id + ' ' + who(b)).includes(f)).sort((a, b) => Math.abs(a.d) - Math.abs(b.d)).slice(0, 6).forEach((b) => out.push({ g: 'Buổi thu', t: `${b.id} · ${who(b)}`, s: `${dm(dayDate(b.d))} ${hm(b.s)} · ${ROOMS[b.room].n}`, fn: () => goBooking(b.id) }))
  }
  return out.slice(0, 14)
}
function renderPal() {
  palItems = palData($('#palIn').value); palIdx = clamp(palIdx, 0, Math.max(0, palItems.length - 1))
  let g = '', h = ''
  palItems.forEach((it, i) => { if (it.g !== g) { g = it.g; h += `<li role="presentation"><div class="gk">${g.toUpperCase()}</div></li>` } h += `<li role="presentation"><button type="button" role="option" data-i="${i}" aria-selected="${i === palIdx}">${esc(it.t)}<small>${esc(it.s)}</small></button></li>` })
  $('#palList').innerHTML = h || '<li class="empty-s" style="padding:16px">Không tìm thấy — thử gõ không dấu, vd. “ngo hep”.</li>'
  $$('#palList [data-i]').forEach((b) => b.onclick = () => runPal(+b.dataset.i))
}
function runPal(i) { const it = palItems[i]; if (!it) return; closeLayer('pal'); it.fn() }
function openPal() { $('#palIn').value = ''; palIdx = 0; renderPal(); openLayer('pal'); $('#palIn').focus() }
$('#palBtn').onclick = openPal
$('#palIn').addEventListener('input', () => { palIdx = 0; renderPal() })
$('#palIn').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); palIdx = clamp(palIdx + (e.key === 'ArrowDown' ? 1 : -1), 0, palItems.length - 1); renderPal(); $('#palList [aria-selected=true]')?.scrollIntoView({ block: 'nearest' }) }
  if (e.key === 'Enter') { e.preventDefault(); runPal(palIdx) }
})
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '')
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); layers.includes('pal') ? closeLayer('pal') : openPal(); return }
  if (e.key === 'Escape') {
    if (layers.length) { closeLayer(layers[layers.length - 1]); return }
    if ($('#tip').classList.contains('on')) { $('#tip').classList.remove('on'); return }
    if (cur === 'lich-phong' && cal.sel) { const id = cal.sel; cal.sel = null; renderCal(); $(`#clips .clip[data-id="${id}"]`)?.focus({ preventScroll: true }) }
    return
  }
  if (typing || layers.length) return
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); return }
  if (e.ctrlKey || e.metaKey || e.altKey) return
  const vk = { 1: 'lich-phong', 2: 'du-an', 3: 'chi-phi', 4: 'dat-phong' }[e.key]
  if (vk && !e.target.closest('.clip')) { location.hash = vk; return }
  if (e.key.toLowerCase() === 'n') { e.preventDefault(); openForm({}) }
})

/* ================= boot ================= */
fillSelects()
renderLcd()
route()
booted = true
document.fonts && document.fonts.ready.then(() => { if (cur === 'lich-phong' && !drag) renderArr() })
let rzT
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (drag) return; chartBuilt = null; if (cur === 'lich-phong') { renderArr(); renderInsp() } else if (cur === 'chi-phi') renderCost() }, 120) })
if (!STATIC) {
  setInterval(() => {
    NOW = new Date(); NH = (NOW - base) / 36e5
    renderLcd()
    if (cur === 'lich-phong' && !drag && !layers.length && !document.activeElement?.closest('#v-lich-phong')) { renderArr(); renderInsp() }
  }, 30000)
  if (G) {
    G.from('.tb > *', { y: -8, opacity: 0, duration: 0.35, stagger: 0.05, clearProps: 'all' })
    G.from($$('.view.on .vh, .view.on .panel, .view.on .day'), { y: 12, opacity: 0, duration: 0.42, stagger: 0.025, delay: 0.08, clearProps: 'all' })
  }
}
