<html lang="vi">
<head>

<style>
:root{--bg:#E4EEF5;--hd:#D2E1ED;--paper:#FAFCFE;--paper2:#EFF5FA;--ink:#152638;--ink2:#40546B;--ink3:#566A80;--line:#C2D3E2;--line2:#DBE6EF;--blue:#265F90;--blue-s:rgba(38,95,144,.1);--seal:#BE2F29;--seal-s:rgba(190,47,41,.08);--ok:#2A7553;--ok-s:rgba(42,117,83,.12);--warn:#9A5F0C;--warn-s:rgba(200,130,20,.14);--gl:#A9C2D8;--sh:0 1px 2px rgba(21,38,56,.06),0 10px 30px -14px rgba(21,38,56,.25);--serif:'Source Serif 4',Georgia,serif;--sans:'Source Sans 3',system-ui,sans-serif;color-scheme:light}
[data-theme=dark]{--bg:#0D1722;--hd:#09121B;--paper:#13202D;--paper2:#182837;--ink:#E3EBF3;--ink2:#A8B9CA;--ink3:#8B9DB0;--line:#2A3D51;--line2:#1F3143;--blue:#89B8E1;--blue-s:rgba(137,184,225,.13);--seal:#EE645B;--seal-s:rgba(238,100,91,.12);--ok:#62C495;--ok-s:rgba(98,196,149,.13);--warn:#E2AA52;--warn-s:rgba(226,170,82,.14);--gl:#1C3045;--sh:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0;font-weight:600}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:600 12px/1 var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;background:var(--paper);white-space:nowrap;color:var(--ink2)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.red{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13.5px}
.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink2);position:relative;transition:background .15s}
.ibtn:hover{background:var(--blue-s);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.inp,select.inp{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 11px;min-width:0;width:100%}
select.inp{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-s)}
.flag{width:22px;height:15px;border-radius:3px;flex:none;background:linear-gradient(90deg,var(--a) 0 33.3%,var(--b) 0 66.6%,var(--c) 0);box-shadow:0 0 0 1px var(--line)}
.flag.jp{background:radial-gradient(circle at 50% 50%,#BC002D 0 3.6px,#fff 4px)}
/* ===== app shell ===== */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:60px minmax(0,1fr) 30px;height:100vh;height:100dvh}
.hd{position:relative;background:var(--hd);border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:18px;padding:0 18px;z-index:30}
.hd .gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9}
.hd>*:not(.gl){position:relative}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.brand .mk{width:36px;height:36px;color:var(--seal)}
.brand b{font:700 19px/1.1 var(--serif);display:block}
.brand small{font-size:12px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;display:block}
.tabs{display:flex;align-items:flex-end;gap:4px;margin-left:10px}
.tab{height:42px;display:flex;align-items:center;gap:8px;padding:0 16px;white-space:nowrap;border:1px solid transparent;border-bottom:0;border-radius:11px 11px 0 0;color:var(--ink2);font-weight:600;font-size:14.5px;text-decoration:none;margin-bottom:-1px;transition:background .15s,color .15s}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.25)}
[data-theme=dark] .tab:hover{background:rgba(255,255,255,.04)}
.tab[aria-current=page]{background:var(--bg);border-color:var(--line);color:var(--ink)}
.tab .n{font-size:12px;font-weight:700;background:var(--seal);color:#fff;border-radius:9px;padding:1px 7px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.sbtn{display:flex;align-items:center;gap:9px;height:40px;padding:0 8px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink3);width:240px;font-size:14px}
.sbtn span{flex:1;text-align:left;white-space:nowrap;overflow:hidden}
.clock{font-size:13px;color:var(--ink2);text-align:right;line-height:1.25;padding:0 8px;white-space:nowrap}
.clock b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--seal);box-shadow:0 0 0 2px var(--hd)}
.me{display:flex;align-items:center;gap:9px;padding-left:6px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--ink);color:var(--paper);flex:none}
.me div{line-height:1.2;font-size:14px;font-weight:600}
.me small{display:block;font-weight:400;color:var(--ink3);font-size:12.5px}
.menu-btn{display:none}
.ft{display:flex;align-items:center;gap:16px;padding:0 18px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line);background:var(--hd);white-space:nowrap;overflow:hidden}
.ft .mrz{font-family:Consolas,'Courier New',monospace;letter-spacing:.14em;color:var(--ink3);opacity:.75;overflow:hidden;flex:1;min-width:0}
.ft .live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:7px;vertical-align:1px}
main{min-height:0;position:relative}
.view{display:none;height:100%}
.view.on{display:block}
/* popovers */
.pop{position:absolute;top:54px;right:0;width:360px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:8px;z-index:40;display:none}
.pop.on{display:block}
.pop h3{font:600 15px var(--serif);padding:8px 10px}
.nt{display:flex;gap:10px;padding:10px;border-radius:9px;text-align:left;width:100%}
.nt:hover{background:var(--paper2)}
.nt i{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--blue)}
.nt i.r{background:var(--seal)}
.nt b{font-weight:600;font-size:14px;display:block}
.nt small{color:var(--ink3);font-size:12.5px}
/* ===== Hồ sơ (master-detail) ===== */
.hs{display:grid;grid-template-columns:318px minmax(0,1fr);gap:18px;padding:16px 18px;height:100%}
.ls{display:flex;flex-direction:column;min-height:0}
.ls-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:2px 2px 12px}
.ls-h h2{font-size:22px}
.ls-h p{margin:0;color:var(--ink3);font-size:13px}
.srch{position:relative}
.srch svg{position:absolute;left:11px;top:11px;color:var(--ink3)}
.srch .inp{padding-left:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.chip{min-height:32px;padding:0 11px;border-radius:16px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);background:transparent;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.chip em{font-style:normal;font-weight:500;color:var(--ink3);font-size:12.5px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed=true] em{color:inherit;opacity:.75}
.ls-l{overflow:auto;min-height:0;flex:1;padding:2px 4px 12px 2px;margin-right:-4px;display:flex;flex-direction:column;gap:8px}
.pc{display:grid;grid-template-columns:auto minmax(0,1fr) 40px;gap:11px;align-items:center;text-align:left;padding:12px 12px 12px 10px;border-radius:12px;background:var(--paper);border:1px solid var(--line2);position:relative;transition:border-color .15s,background .15s}
.pc:hover{border-color:var(--line)}
.pc[aria-current=true]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--seal)}
.pc .flag{align-self:start;margin-top:4px}
.pc b{font-weight:600;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc small{display:block;color:var(--ink3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .mt{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.pc .pri-s{position:absolute;top:9px;right:56px;color:var(--warn)}
.pc .pri-s svg{width:14px;height:14px;fill:currentColor}
.due{font-weight:600;border-radius:5px;padding:0 6px;background:var(--blue-s);color:var(--blue);white-space:nowrap}
.due.w{background:var(--warn-s);color:var(--warn)}
.due.r{background:var(--seal-s);color:var(--seal)}
.due.o{background:var(--ok-s);color:var(--ok)}
.due.g{background:var(--paper2);color:var(--ink3)}
.ring{width:40px;height:40px;position:relative}
.ring svg{width:40px;height:40px;rotate:-90deg}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.empty{padding:34px 16px;text-align:center;color:var(--ink3)}
.empty b{display:block;font:600 17px var(--serif);color:var(--ink);margin:8px 0 4px}
/* dossier document = sheet + stub */
.doc{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);position:relative}
.sheet{overflow:auto;min-height:0;position:relative;border-radius:16px 0 0 16px;background-image:radial-gradient(circle at 92% 6%,var(--seal-s),transparent 34%)}
.stub{overflow:auto;min-height:0;border-left:2px dashed var(--line);position:relative;background:var(--paper2);border-radius:0 16px 16px 0}
.perf{position:absolute;left:calc(100% - 300px - 11px);width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line);z-index:2}
.perf.t{top:-11px;clip-path:inset(50% 0 0 0)}
.perf.b{bottom:-11px;clip-path:inset(0 0 50% 0)}
.sh-in{padding:24px 28px 0}
.sh-head{display:grid;grid-template-columns:minmax(0,1fr) 136px;gap:16px}
.sh-id{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.sh-id .pr{color:var(--warn)}
.sh-head h1{font-size:34px;margin:6px 0 4px;letter-spacing:-.01em}
.sh-sub{margin:0;color:var(--ink2);font-size:14.5px}
.sh-sub b{font-weight:600;color:var(--ink);letter-spacing:.04em}
.sh-sel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.slot{width:136px;height:136px;display:grid;place-items:center;position:relative;align-self:start}
.slot .ph{width:118px;height:118px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--ink3);line-height:1.3;padding:14px}
.seal{color:var(--seal);display:block;overflow:visible}
.slot .seal{position:absolute;inset:0;margin:auto}
.pri-b{width:40px;height:40px;margin:-12px -6px -12px -10px;color:var(--ink3)}
.pri-b svg{width:16px;height:16px}
.pri-b[aria-pressed=true]{color:var(--warn)}
.pri-b[aria-pressed=true] svg{fill:currentColor}
.steps{list-style:none;margin:22px 0 0;padding:16px 0 0;border-top:1px solid var(--line2);display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.steps li{position:relative;text-align:center;font-size:13px;color:var(--ink3);padding:0 4px}
.steps li::before{content:'';position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.steps li:first-child::before{display:none}
.steps li.d::before,.steps li.c::before{background:var(--ink2)}
.steps .nd{width:24px;height:24px;margin:0 auto 6px;border-radius:50%;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;position:relative;z-index:1}
.steps .nd svg{width:13px;height:13px;stroke-width:3}
.steps li.d .nd{background:var(--ink2);border-color:var(--ink2);color:var(--paper)}
.steps li.c .nd{border-color:var(--seal);box-shadow:0 0 0 4px var(--seal-s)}
.steps li.c .nd::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--seal)}
.steps li b{display:block;font-weight:600;color:var(--ink2);line-height:1.25}
.steps li.c b{color:var(--ink)}
.steps li small{font-size:12px}
.st-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--paper2);font-size:14px;color:var(--ink2)}
.st-act p{margin:0;flex:1;min-width:200px}
.dl{margin-top:24px}
.dl-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.dl-h h2{font-size:21px}
.dl-h p{margin:2px 0 0;color:var(--ink3);font-size:13.5px}
.tray{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink3);line-height:1.3;max-width:240px}
.stool{width:52px;height:52px;flex:none;border-radius:50%;color:var(--seal);touch-action:none;display:grid;place-items:center;background:var(--paper);box-shadow:0 2px 0 var(--line),0 6px 14px -6px rgba(0,0,0,.35);cursor:grab;user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.stool:hover{box-shadow:0 2px 0 var(--seal),0 8px 18px -6px rgba(0,0,0,.4)}
.stool svg{width:44px;height:44px}
.vn-ghost{position:fixed;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:90;color:var(--seal);opacity:.92}
.vn-ghost svg{width:64px;height:64px}
.dl-list{list-style:none;margin:0;padding:0}
.dl-row{display:grid;grid-template-columns:34px minmax(0,1fr) 116px auto;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line2);position:relative;outline:none;border-radius:4px}
.dl-row:focus-visible{box-shadow:inset 0 0 0 2px var(--blue)}
.dl-row.act{background:var(--blue-s)}
.dl-row.vn-over{background:var(--seal-s);box-shadow:inset 0 0 0 2px var(--seal)}
.dl-no{font:600 14px var(--serif);color:var(--ink3);font-variant-numeric:tabular-nums}
.dl-m b{font-weight:600;font-size:15px}
.dl-m .op{font-size:12px;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.dl-m small{display:block;color:var(--ink3);font-size:13px;line-height:1.4}
.dl-m .inp{margin-top:6px;height:34px;font-size:13.5px;border-color:var(--warn)}
.pill{font-size:12.5px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap;justify-self:start}
.p0{background:var(--paper2);color:var(--ink3);border:1px dashed var(--line)}
.p1{background:var(--blue-s);color:var(--blue)}
.p2{background:var(--warn-s);color:var(--warn)}
.mst{justify-self:start;display:inline-flex;flex-direction:column;align-items:center;border:2px solid var(--seal);color:var(--seal);border-radius:7px;padding:1px 9px 2px;rotate:-7deg;font-weight:700;line-height:1.15;filter:url(#vnInk)}
.mst b{font-size:14px;letter-spacing:.14em}
.mst small{font-size:12px;font-weight:600;letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
.seg button{min-height:36px;padding:0 11px;font-size:13.5px;font-weight:600;color:var(--ink2);border-left:1px solid var(--line);white-space:nowrap;transition:background .15s,color .15s}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--paper2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg button.s3[aria-pressed=true]{background:var(--seal);color:#fff}
.sh-foot{position:sticky;bottom:0;margin-top:22px;padding:14px 28px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;z-index:3}
.prog{flex:1;min-width:180px}
.prog b{font-size:14px}
.prog small{color:var(--ink3);font-size:13px;margin-left:6px}
.bar{height:8px;border-radius:4px;background:var(--line2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px;transform-origin:0 50%}
.bar i.full{background:var(--seal)}
.keys{font-size:12.5px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* stub */
.stub-in{padding:24px 22px 26px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}
.cd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;color:var(--ink)}
.cd b{font:700 46px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.cd span{font-size:16px;font-weight:600;color:var(--ink2);margin-right:6px}
.cd.w b{color:var(--warn)}
.cd.r b{color:var(--seal)}
.cd.o b{color:var(--ok)}
.cd-d{margin:6px 0 0;font-size:14px;color:var(--ink2)}
.tl{position:relative;height:30px;margin:18px 0 6px}
.tl .tk{position:absolute;top:13px;left:0;right:0;height:4px;border-radius:2px;background:var(--line)}
.tl .tp{position:absolute;top:13px;left:0;height:4px;border-radius:2px;background:var(--ink2)}
.tl i{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--paper2)}
.tl i.now{top:2px;width:2px;height:26px;margin-left:-1px;border:0;border-radius:1px;background:var(--ink)}
.kd{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 10px;font-size:14px}
.kd dt{color:var(--ink3);display:flex;align-items:center;gap:7px}
.kd dt i{width:9px;height:9px;border-radius:50%;flex:none}
.kd dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.kd dd small{display:block;font-weight:400;color:var(--ink3);font-size:12.5px}
.box{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.box h3{font-size:16px;margin-bottom:8px}
.fee{display:grid;grid-template-columns:1fr auto;gap:5px 0;font-size:14px}
.fee span{color:var(--ink2)}
.fee b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;padding-left:10px}
.fee .tot{border-top:1px solid var(--line);padding-top:6px}
.log{list-style:none;margin:0;padding:0}
.log li{position:relative;padding:0 0 12px 18px;font-size:14px}
.log li::before{content:'';position:absolute;left:3px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.log li::after{content:'';position:absolute;left:6px;top:16px;bottom:0;width:1px;background:var(--line)}
.log li:last-child::after{display:none}
.log li.s::before{background:var(--seal)}
.log small{display:block;color:var(--ink3);font-size:12.5px}
.nf{display:flex;gap:8px;margin-top:6px;align-items:flex-start}
.nf .field{flex:1}
.err{color:var(--seal);font-size:12.5px;font-weight:600;min-height:0}
.err:empty{display:none}
.inp[aria-invalid=true]{border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-s)}
.back{display:none}
/* ===== Danh sách ===== */
.tv{height:100%;overflow:auto;padding:20px 24px 28px}
.pg-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.pg-h h1{font-size:28px}
.pg-h p{margin:2px 0 0;color:var(--ink3);font-size:14px}
.pg-h .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbar{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(3,minmax(130px,1fr)) auto;gap:10px;align-items:end;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px 12px 0 0;border-bottom:0}
.bulk{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--ink);color:var(--paper)}
.bulk.on{display:flex}
.bulk b{font-weight:600;margin-right:6px}
.bulk .btn{background:transparent;color:var(--paper);border-color:rgba(255,255,255,.3)}
.bulk select.inp{width:auto;height:34px;background-color:transparent;color:var(--paper);border-color:rgba(255,255,255,.3)}
.bulk select.inp option{color:#152638}
.tw{background:var(--paper);border:1px solid var(--line);border-radius:0 0 12px 12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;text-align:left;padding:0 12px;height:42px;background:var(--paper2);border-bottom:1px solid var(--line);white-space:nowrap}
th button{display:inline-flex;align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit;min-height:32px}
th button:hover{color:var(--ink)}
th[aria-sort] button{color:var(--ink)}
.ar{font-size:12px}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.sel td{background:var(--blue-s)}
tbody tr:hover td{background:var(--paper2)}
tbody tr.sel:hover td{background:var(--blue-s)}
.cb{width:18px;height:18px;accent-color:var(--ink);cursor:pointer;margin:0}
.cbw{display:grid;place-items:center;width:40px;height:40px;margin:-8px 0}
td .nm{font-weight:600;display:block}
td small{color:var(--ink3);font-size:13px;display:block;white-space:nowrap}
td.cid{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mid{display:none}
.mall{display:none;min-height:40px;cursor:pointer}
.cc{display:flex;align-items:center;gap:8px;white-space:nowrap}
.stp{font-size:12.5px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--paper2);color:var(--ink2);border:1px solid var(--line2)}
.stp.s1,.stp.s2{background:var(--blue-s);color:var(--blue);border-color:transparent}
.stp.s3{background:var(--warn-s);color:var(--warn);border-color:transparent}
.stp.ok{background:var(--ok-s);color:var(--ok);border-color:transparent}
.stp.no{background:var(--seal-s);color:var(--seal);border-color:transparent}
.mini{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.mini .bar{width:64px;margin:0}
.ra{display:flex;gap:2px;justify-content:flex-end}
.pgn{display:flex;align-items:center;gap:6px;padding:12px 14px;justify-content:space-between;flex-wrap:wrap;font-size:14px;color:var(--ink3)}
.pgn .pp{display:flex;gap:4px}
.pgn .pp button{min-width:36px;height:36px;border-radius:8px;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink2);background:var(--paper)}
.pgn .pp button[aria-current=page]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pgn .pp button:disabled{opacity:.4;cursor:default}
/* ===== Lịch hạn nộp ===== */
.cv{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:18px 20px;height:100%}
.cal{display:flex;flex-direction:column;min-height:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.cal-h h1{font-size:24px;margin-right:auto}
.cal-h h1 small{font:400 14px var(--sans);color:var(--ink3);margin-left:8px}
.tf{display:flex;gap:6px;flex-wrap:wrap}
.tf .chip i{width:9px;height:9px;border-radius:2px}
.tf .chip[aria-pressed=false]{opacity:.55;text-decoration:line-through}
.tf .chip[aria-pressed=true]{background:var(--paper2);color:var(--ink);border-color:var(--ink3)}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--paper2)}
.wd span{padding:8px 10px;font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
.wd .s{display:none}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);flex:1;min-height:0;overflow:auto}
.cell{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px 7px 6px;min-height:112px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.cell:nth-child(7n){border-right:0}
.cell.past{background:repeating-linear-gradient(135deg,transparent 0 7px,var(--line2) 7px 8px)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cell .dn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:28px;padding:0 4px;border-radius:6px;font-weight:600;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell .dn:hover{background:var(--paper2)}
.cell.today .dn b{background:var(--seal);color:#fff;border-radius:6px;padding:0 7px}
.cell .dn em{font-style:normal;font-size:12px;color:var(--ink3);font-weight:500}
.ev{display:flex;align-items:center;gap:6px;width:100%;min-height:22px;padding:0 6px;border-radius:5px;font-size:12.5px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;border-left:3px solid;background:var(--paper2)}
.ev span{overflow:hidden;text-overflow:clip}
.ev.nop{border-color:var(--seal);color:var(--ink)}
.ev.pv{border-color:var(--blue);color:var(--ink)}
.ev.bay{border-color:var(--ink3);color:var(--ink2)}
.ev:hover{background:var(--line2)}
.more{font-size:12.5px;color:var(--blue);font-weight:600;text-align:left;padding:0 6px;min-height:20px}
.dots{display:none;gap:3px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%}
.ag{background:var(--paper2);border:1px solid var(--line);border-radius:14px;overflow:auto;min-height:0;padding:18px}
.ag h2{font-size:21px}
.ag>p{margin:2px 0 14px;color:var(--ink3);font-size:14px}
.ai{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2);text-align:left;width:100%}
.ai i{align-self:stretch;border-radius:2px}
.ai b{font-weight:600;display:block}
.ai small{color:var(--ink3);font-size:13px;display:block}
.ai .t{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink2);text-align:right}
.ai:hover b{text-decoration:underline}
.c-nop{background:var(--seal)}.c-pv{background:var(--blue)}.c-bay{background:var(--ink3)}
/* ===== Báo cáo ===== */
.rv{height:100%;overflow:auto;padding:20px 24px 28px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden;margin-bottom:18px}
.kpi{padding:16px 18px;border-left:1px dashed var(--line)}
.kpi:first-child{border-left:0}
.kpi>span{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kpi>b{display:block;font:700 34px/1.15 var(--serif);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi>small{color:var(--ink3);font-size:13px}
.rg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;min-width:0}
.card h2{font-size:19px}
.card .sub{margin:2px 0 12px;color:var(--ink3);font-size:13.5px}
.card.wide{grid-column:1/-1}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#wk{width:100%;height:270px;display:block}
#wk text{font:12px var(--sans);fill:var(--ink3)}
#wk .gl{stroke:var(--line2)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;line-height:1.45;padding:8px 11px;border-radius:8px;opacity:0;transition:opacity .12s;z-index:5;white-space:nowrap}
.tip b{font-weight:700}
.cb-row{display:grid;grid-template-columns:142px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.cb-row .tr{height:12px;border-radius:6px;background:var(--line2);overflow:hidden}
.cb-row .tr i{display:block;height:100%;background:var(--blue);transform-origin:0 50%;border-radius:6px}
.cb-row b{text-align:right;font-variant-numeric:tabular-nums}
.cb-row>span:first-child{display:flex;align-items:center;gap:7px;white-space:nowrap}
.rs{list-style:none;margin:0;padding:0}
.rs li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px}
.rs li .bar{grid-column:1/-1;margin:0;height:5px}
.rs li .bar i{background:var(--seal)}
.stk{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.stk i{display:block;height:100%}
.stk-l{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;font-size:13px;color:var(--ink2)}
.stk-l span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stk-l b{margin-left:auto;font-variant-numeric:tabular-nums}
.stk-l i{width:9px;height:9px;border-radius:2px;flex:none}
/* ===== overlays ===== */
.scrim{position:fixed;inset:0;background:rgba(10,20,32,.42);z-index:60;display:none}
.scrim.on{display:block}
.modal{position:fixed;left:50%;top:50%;translate:-50% -50%;width:min(660px,calc(100vw - 32px));max-height:calc(100vh - 150px);display:none;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);z-index:61}
.modal.on{display:flex}
.m-h{display:flex;align-items:center;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line2)}
.m-h h2{font-size:22px;margin-right:auto}
.m-b{padding:16px 20px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.m-b .full{grid-column:1/-1}
.m-f{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line2)}
.m-f p{margin:0 auto 0 0;font-size:13px;color:var(--ink3)}
.pal{position:fixed;left:50%;top:12vh;translate:-50% 0;width:min(600px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);z-index:70;display:none;overflow:hidden}
.pal.on{display:block}
.pal-i{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.pal-i input{flex:1;height:54px;border:0;background:none;font-size:16px;outline:none;min-width:0}
.pal-l{max-height:min(380px,55vh);overflow:auto;padding:6px}
.pal-g{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:8px 10px 4px}
.pal-o{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;text-align:left;font-size:14.5px;min-height:40px}
.pal-o small{margin-left:auto;color:var(--ink3);font-size:12.5px;white-space:nowrap}
.pal-o[aria-selected=true]{background:var(--blue-s)}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--paper);z-index:65;padding:16px;display:none;flex-direction:column;gap:4px;box-shadow:var(--sh)}
.drawer.on{display:flex}
.drawer .dv{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600}
.drawer .dv[aria-current=page]{background:var(--ink);color:var(--paper)}
.toasts{position:fixed;left:18px;bottom:42px;z-index:80;display:flex;flex-direction:column;gap:8px;width:min(318px,calc(100vw - 32px))}
body.mo .toasts{left:50%;translate:-50% 0;top:14px;bottom:auto}
.toast{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:11px;background:var(--ink);color:var(--paper);box-shadow:var(--sh);font-size:14px}
.toast span{flex:1}
.toast .u{font-weight:700;color:var(--paper);text-decoration:underline;min-height:34px;padding:0 6px}
.toast .x{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;opacity:.75}
.toast.r{background:var(--seal)}
/* ===== responsive ===== */
@media (max-width:1380px){.clock{display:none}}
@media (max-width:1279px){
  .me div{display:none}
  .sbtn{width:210px}
  .doc{display:block;overflow:auto;min-height:0}
  .sheet,.stub{overflow:visible;border-radius:0}
  .stub{border-left:0;border-top:2px dashed var(--line);border-radius:0 0 16px 16px}
  .perf{display:none}
  .sh-foot{position:sticky}
  .stub-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px}
  .stub-in .box{margin-top:0;padding-top:0;border-top:0}
  .stub-in .box.lg2{grid-column:1/-1;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
  .hs{grid-template-columns:290px minmax(0,1fr)}
  .tbar{grid-template-columns:1fr 1fr 1fr;}
  .tbar .srch{grid-column:1/-1}
  .cv{grid-template-columns:minmax(0,1fr) 280px}
  .rg{grid-template-columns:1fr}
  .ev .cs{display:none}
  .tw{overflow-x:auto;background:linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(-90deg,var(--paper) 30%,transparent) 100% 0,radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.14),transparent) 100% 0;background-repeat:no-repeat;background-size:40px 100%,40px 100%,14px 100%;background-attachment:local,local,scroll;background-color:var(--paper)}
  table{min-width:760px}
}
@media (max-width:1100px) and (min-width:760px){
  th:nth-child(2),td.cid{display:none}
  .mid{display:inline}
}
@media (max-width:959px) and (min-width:760px){
  th:nth-child(8),td[data-l="Phụ trách"]{display:none}
  .mini .bar{width:44px}
}
@media (max-width:1100px){
  .tab{padding:0 12px}
  .tab>svg,.brand small{display:none}
  .sh-head{grid-template-columns:minmax(0,1fr) 112px}
  .slot{width:112px;height:112px}
  .slot .ph{width:100px;height:100px}
  .slot .seal{width:112px;height:112px}
  .dl-row{grid-template-columns:30px minmax(0,1fr) auto;row-gap:8px}
  .dl-row .seg{grid-column:2/-1;justify-self:start}
}
@media (max-width:959px){
  .tabs,.sbtn span,.sbtn kbd{display:none}
  .sbtn{width:40px;padding:0;justify-content:center;border:0;background:none}
  .menu-btn{display:grid}
  .hd{gap:8px;padding:0 10px}
  .hs{grid-template-columns:262px minmax(0,1fr);gap:14px;padding:14px}
  .sh-in{padding:20px 20px 0}
  .sh-foot{padding:12px 20px}
  .sh-sel{grid-template-columns:1fr 1fr}
  .sh-sel .field:first-child{grid-column:1/-1}
  .stub-in{grid-template-columns:1fr}
  .stub-in .box{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
  .cv{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;height:auto;min-height:100%}
  .cv .cal{min-height:640px}
  .ag{overflow:visible}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px dashed var(--line)}
  .ft .mrz{display:none}
}
@media (max-width:759px){
  .app{display:block;height:auto}
  .hd{position:sticky;top:0;height:58px}
  .brand small{display:none}
  .me{display:none}
  .view{height:auto}
  .hs{display:block;padding:12px}
  .hs .doc{display:none}
  .hs.det .ls{display:none}
  .hs.det .doc{display:block;overflow:visible;border-radius:14px}
  .ls-l{overflow:visible;margin:0;padding:0 0 12px}
  .back{display:flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--ink2);margin:-4px 0 6px}
  .sh-in{padding:18px 16px 0}
  .sh-head{grid-template-columns:minmax(0,1fr) 84px;gap:8px}
  .sh-head h1{font-size:27px}
  .slot{width:84px;height:84px}
  .slot .ph{width:80px;height:80px;font-size:12px;padding:8px}
  .slot .seal{width:84px;height:84px}
  .sh-sel{grid-template-columns:1fr}
  .steps li{font-size:12px;padding:0 1px}
  .steps li small{display:none}
  .tray{margin-left:0;max-width:none;width:100%}
  .dl-row{grid-template-columns:26px minmax(0,1fr);padding:12px 2px}
  .dl-row .pill,.dl-row .mst{grid-column:2}
  .dl-row .seg{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);width:100%}
  .dl-row .seg button{min-height:40px}
  .sh-foot{padding:12px 16px;bottom:0}
  .keys{display:none}
  .sh-foot{flex-wrap:nowrap;gap:12px}
  .prog{min-width:0}
  .prog small,.xl{display:none}
  .stub-in{padding:20px 16px}
  .tv,.rv{padding:14px 12px 24px;overflow:visible}
  .pg-h h1{font-size:24px}
  .pg-h .sp{margin-left:0}
  .tbar{grid-template-columns:1fr 1fr;padding:12px}
  .tbar .srch,.tbar .pt{grid-column:1/-1}
  .tw{border-radius:0 0 12px 12px;background:transparent;border:0;overflow:visible}
  table,tbody{display:block;min-width:0}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 8px;padding:12px 10px;margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
  tbody tr td{border:0;padding:3px 0;background:none!important}
  tbody tr td[data-l]{grid-column:2/-1;display:flex;justify-content:space-between;gap:10px;align-items:center}
  tbody tr td[data-l]::before{content:attr(data-l);font-size:12.5px;color:var(--ink3);font-weight:600}
  tbody tr td.c0{grid-row:1/3}
  tbody tr td.cid{display:none}
  .mall{display:inline-flex}
  .mid{display:inline}
  tbody tr td.c1{grid-column:2}
  tbody tr td.ra{grid-column:3;grid-row:1}
  tbody tr.sel{border-color:var(--ink)}
  .pgn{padding:12px 0}
  .bulk{border-radius:10px;margin-top:8px;position:sticky;top:64px;z-index:5}
  .cv{display:block;padding:12px}
  .cv .cal{min-height:0}

/* ---------- checklist actions ---------- */
const SNAME = ['chưa nhận', 'đã nhận', 'cần bổ sung', 'đạt']
function snap(a) { return JSON.stringify({ c: a.c, vt: a.vt, stage: a.stage, docs: a.docs, at: a.at, fix: a.fix, log: a.log, res: a.res, sealedAt: a.sealedAt, pri: a.pri, staff: a.staff }) }
function restore(a, s) { Object.assign(a, JSON.parse(s)); refresh() }
function setDoc(k, s, from) {
  const a = app(); if (a.docs[k] === s) return
  if (a.sealedAt) { toast('Hồ sơ đã đóng dấu đủ — hoàn tác đóng dấu trước khi sửa giấy tờ.', null, 'r'); return }
  const before = snap(a)
  a.docs[k] = s; a.at[k] = now()
  if (s === 2 && !a.fix[k]) a.fix[k] = FIX[0]
  a.log.unshift({ t: now(), s: `${DN[k]}: ${SNAME[s]}`, k: s === 3 ? 1 : 0 })
  refresh()
  focusRow(from)
  if (s === 3) thump($(`#dlL [data-k="${k}"] .mst`))
  const full = okCount(a) === reqDocs(a).length && !a.sealedAt
  toast(`${DN[k]} — ${SNAME[s]}${full ? '. Đủ giấy tờ, có thể đóng dấu hồ sơ.' : ''}`, () => restore(a, before))
}
function thump(el, big) {
  if (!el || !ANIM || STATIC) return
  G.fromTo(el, { scale: big ? 1.9 : 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: big ? 0.38 : 0.26, ease: 'power3.in', clearProps: 'transform,opacity' })
  if (big) G.fromTo('#doc', { x: 0 }, { x: 2, duration: 0.05, repeat: 3, yoyo: true, delay: 0.36, clearProps: 'transform' })
}
function focusRow(f) { const r = $(`#dlL [data-j="${ACT}"]`); if (!r || !f) return; if (f === 'key') r.focus(); else r.querySelector(`[data-s="${f.slice(3)}"]`)?.focus() }
function setAct(j, f) {
  const rows = $$('#dlL .dl-row'); if (!rows.length) return
  ACT = Math.max(0, Math.min(rows.length - 1, j))
  rows.forEach((r, i) => { r.classList.toggle('act', i === ACT); r.tabIndex = i === ACT ? 0 : -1 })
  if (f) { rows[ACT].focus(); rows[ACT].scrollIntoView({ block: 'nearest' }) }
}
function sealDossier() {
  const a = app(), left = reqDocs(a).length - okCount(a)

  const before = snap(a)

  refresh(); thump($('#slot .seal'), true)

}
function changeCountry(c, vt) {
  const a = app(), before = snap(a), old = docsFor(a).map((d) => d[0]), oldN = C[a.c].n
  a.c = c; a.vt = vt
  const nd = {}
  docsFor(a).forEach(([k]) => (nd[k] = a.docs[k] || 0))
  const kept = Object.keys(nd).filter((k) => old.includes(k) && nd[k]).length
  a.docs = nd; a.pv = C[c].pv ? a.due + 2 * DAY : null

/* ---------- stamp drag ---------- */
let DRAG = null
function dragMove(e) {
  if (!DRAG) return
  if (!DRAG.moved && Math.hypot(e.clientX - DRAG.x, e.clientY - DRAG.y) < 6) return
  if (!DRAG.moved) { DRAG.moved = true; DRAG.g = document.createElement('div'); DRAG.g.className = 'vn-ghost'; DRAG.g.innerHTML = TOOL; document.body.appendChild(DRAG.g) }
  DRAG.px = e.clientX; DRAG.py = e.clientY
  DRAG.g.style.transform = `translate(${e.clientX - 32}px, ${e.clientY - 32}px) rotate(-10deg)`
  dragHit()
  // Long checklists overflow the screen: hold the stamp near an edge to auto-scroll.
  const sc = scroller(), r = sc === window ? { top: 58, bottom: innerHeight } : sc.getBoundingClientRect()
  DRAG.vy = e.clientY > r.bottom - 60 ? 14 : e.clientY < r.top + 50 ? -14 : 0
  if (DRAG.vy && !DRAG.as) DRAG.as = setInterval(() => { if (!DRAG || !DRAG.vy) return; sc.scrollBy(0, DRAG.vy); dragHit() }, 30)
}
function dragHit() {
  const el = document.elementFromPoint(DRAG.px, DRAG.py), row = el && el.closest('#dlL .dl-row')
  if (DRAG.over !== row) { DRAG.over?.classList.remove('vn-over'); row?.classList.add('vn-over'); DRAG.over = row }
}
const scroller = () => (mob() ? window : getComputedStyle($('#sheet')).overflowY === 'auto' ? $('#sheet') : $('#doc'))
function dragEnd(e, cancel) {
  if (!DRAG) return
  const d = DRAG; DRAG = null
  clearInterval(d.as); document.body.style.userSelect = ''
  d.g?.remove(); d.over?.classList.remove('vn-over')
  if (cancel) return
  if (!d.moved) { const r = $(`#dlL [data-j="${ACT}"]`); if (r) setDoc(r.dataset.k, 3); return }
  if (d.over) { ACT = Number(d.over.dataset.j); setDoc(d.over.dataset.k, 3) }
}

/* ---------- calendar ---------- */
const ETY = { nop: ['Hạn nộp', 'c-nop'], pv: ['Phỏng vấn / sinh trắc', 'c-pv'], bay: ['Ngày bay', 'c-bay'] }
function events() {
  const ev = []
  for (const a of APPS) {
    if (a.stage <= 3) ev.push({ t: a.due, ty: 'nop', a })
    if (a.pv && a.stage <= 4) ev.push({ t: a.pv, ty: 'pv', a })
    if (a.stage <= 4 || a.res === 'dau') ev.push({ t: a.fly, ty: 'bay', a })
  }
  return ev.filter((e) => CAL.ty[e.ty]).sort((x, y) => x.t - y.t)
}
const evName = (e) => (e.ty === 'pv' ? C[e.a.c].pv : ETY[e.ty][0])
function renderCal() {
  const mon = T0 - ((new Date(T0).getDay() + 6) % 7) * DAY + CAL.off * 28 * DAY
  const days = Array.from({ length: 35 }, (_, i) => mon + i * DAY)

  ev.forEach((e) => { (by[sod(e.t)] = by[sod(e.t)] || []).push(e) })
  const sel = by[CAL.day] || [], d0 = new Date(mon), d1 = new Date(days[34])
  const up = ev.filter((e) => e.t >= now() && sod(e.t) !== CAL.day).slice(0, 4)
  const sd = new Date(CAL.day)
  // touch: the whole day cell is the tap target (opens that day in the agenda), so chips are drawn, not buttons
  const ET = matchMedia('(pointer: coarse)').matches ? 'span' : 'button'

/* ---------- toast ---------- */
function toast(msg, undo, kind) {
  const host = $('#toasts')
  while (host.children.length >= 2) host.firstChild.remove()
  const el = document.createElement('div')
  el.className = 'toast ' + (kind || '')
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button class="u">Hoàn tác</button>' : ''}<button class="x" aria-label="Đóng thông báo">${ic('x')}</button>`
  host.appendChild(el)
  const kill = () => el.remove()
  el.querySelector('.x').onclick = kill
  if (undo) el.querySelector('.u').onclick = () => { kill(); undo(); toast('Đã hoàn tác.') }
  if (ANIM && !STATIC) G.from(el, { opacity: 0, y: 10, duration: 0.22, clearProps: 'all' })
  setTimeout(kill, undo ? 6500 : 3500)
}

  if (t.classList.contains('pc')) { select(t.dataset.id, true); return }
  if (t.id === 'backBtn') { $('#hs').classList.remove('det'); history.replaceState(null, '', '#ho-so'); document.title = 'Hồ sơ · Visa Nhanh'; renderList(); $(`#lsL [data-id="${SEL}"]`)?.focus(); return }
  if (t.id === 'priBtn') { const a = app(), b = snap(a); a.pri = !a.pri; refresh(); $('#priBtn').focus(); toast(a.pri ? 'Đã gắn ưu tiên.' : 'Đã bỏ ưu tiên.', () => restore(a, b)); return }
  if (t.id === 'sealBtn') { sealDossier(); return }
  if (t.dataset.adv) { advance(Number(t.dataset.adv)); return }
  if (t.dataset.res) { advance(5, t.dataset.res); return }
  if (t.matches('[data-remind]')) { const a = app(), miss = docsFor(a).filter(([k, r]) => r && a.docs[k] !== 3).length; a.log.unshift({ t: now(), s: `Nhắc khách bổ sung ${miss} giấy tờ qua Zalo` }); renderStub(); toast(`Đã gửi Zalo nhắc ${a.name} bổ sung ${miss} giấy tờ.`); return }
  if (t.dataset.s && t.closest('.dl-row')) { const row = t.closest('.dl-row'); ACT = Number(row.dataset.j); setDoc(row.dataset.k, Number(t.dataset.s), 'btn' + t.dataset.s); return }
  if (t.id === 'stool') { if (!e.detail) { const r = $(`#dlL [data-j="${ACT}"]`); if (r) setDoc(r.dataset.k, 3, 'key') } return }
  if (t.id === 'openPal') { openPal(); return }
  if (t.id === 'ntBtn') { toggleNt(); return }
  if (t.id === 'themeBtn') { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true); return }
  if (t.id === 'menuBtn') { openDrawer(); return }
  if (t.dataset.pi) { palRun(Number(t.dataset.pi)); return }
  // table
  if (t.dataset.sort) { if (TB.sort === t.dataset.sort) TB.dir *= -1; else { TB.sort = t.dataset.sort; TB.dir = 1 } renderTable(); $(`[data-sort="${TB.sort}"]`).focus(); return }
  if (t.dataset.pg) { TB.page = Number(t.dataset.pg); renderTable(); return }
  if (t.id === 'tP') { TB.pri = !TB.pri; t.setAttribute('aria-pressed', TB.pri); TB.page = 1; renderTable(); return }
  if (t.id === 'tClear') { Object.assign(TB, { q: '', c: '', st: '', sf: '', pri: false, page: 1 }); $('#tQ').value = ''; $('#tC').value = ''; $('#tS').value = ''; $('#tF').value = ''; $('#tP').setAttribute('aria-pressed', 'false'); renderTable(); return }
  if (t.id === 'tExport') { toast(`Đã xuất ${tRows().length} hồ sơ ra tệp CSV (mô phỏng).`); return }
  if (t.dataset.del) { delApps([t.dataset.del]); return }
  if (t.id === 'bClr') { TB.sel.clear(); renderTable(); return }
  if (t.id === 'bPri') { const ids = [...TB.sel], prev = ids.map((id) => [id, APPS.find((a) => a.id === id).pri]); ids.forEach((id) => (APPS.find((a) => a.id === id).pri = true)); renderTable(); toast(`Đã gắn ưu tiên ${ids.length} hồ sơ.`, () => { prev.forEach(([id, p]) => { const a = APPS.find((x) => x.id === id); if (a) a.pri = p }); refresh() }); return }
  if (t.id === 'bRem') { toast(`Đã gửi Zalo nhắc giấy tờ cho ${TB.sel.size} khách.`); return }
  if (t.id === 'bDel') { delApps([...TB.sel]); return }
  // calendar
  if (t.dataset.day) { CAL.day = Number(t.dataset.day); renderCal(); $(`.cell [data-day="${CAL.day}"].dn`)?.focus(); if (mob()) $('.ag').scrollIntoView({ block: 'start' }); return }
  if (t.dataset.ty) { CAL.ty[t.dataset.ty] = !CAL.ty[t.dataset.ty]; renderCal(); $(`[data-ty="${t.dataset.ty}"]`).focus(); return }
  if (t.dataset.cw !== undefined) { const v = Number(t.dataset.cw); CAL.off = v === 0 ? 0 : CAL.off + v; if (v === 0) CAL.day = T0; renderCal(); return }
  if (t.dataset.rg) { RANGE = Number(t.dataset.rg); $$('[data-rg]').forEach((b) => b.setAttribute('aria-pressed', b === t)); renderReport(true); return }
})
document.addEventListener('change', (e) => {
  const t = e.target
  if (t.id === 'dC') changeCountry(t.value, 0)
  else if (t.id === 'dV') changeCountry(app().c, Number(t.value))
  else if (t.id === 'dS') { const a = app(), b = snap(a); a.staff = t.value; a.log.unshift({ t: now(), s: `Giao cho ${t.value}` }); renderStub(); renderList(); toast(`Đã giao hồ sơ cho ${t.value}.`, () => restore(a, b)) }
  else if (t.classList.contains('dl-fix')) { const a = app(); a.fix[t.dataset.k] = t.value; toast('Đã lưu ghi chú bổ sung.') }
  else if (t.dataset.sel) { t.checked ? TB.sel.add(t.dataset.sel) : TB.sel.delete(t.dataset.sel); renderTable() }
  else if (t.id === 'tAll' || t.id === 'tAll2') { const ids = tRows().slice((TB.page - 1) * 10, TB.page * 10).map((a) => a.id); ids.forEach((id) => (t.checked ? TB.sel.add(id) : TB.sel.delete(id))); renderTable(); $('#tAll')?.focus() }
  else if (t.id === 'tC' || t.id === 'tS' || t.id === 'tF') { TB[{ tC: 'c', tS: 'st', tF: 'sf' }[t.id]] = t.value; TB.page = 1; renderTable() }
  else if (t.id === 'bAs' && t.value) { const ids = [...TB.sel], prev = ids.map((id) => [id, APPS.find((a) => a.id === id).staff]), who = t.value; ids.forEach((id) => (APPS.find((a) => a.id === id).staff = who)); renderTable(); toast(`Đã giao ${ids.length} hồ sơ cho ${who}.`, () => { prev.forEach(([id, s]) => { const a = APPS.find((x) => x.id === id); if (a) a.staff = s }); refresh() }) }
})
document.addEventListener('input', (e) => {
  const t = e.target
  if (t.id === 'lsQ') { LQ = t.value; renderList() }
  else if (t.id === 'tQ') { TB.q = t.value; TB.page = 1; renderTable() }
  else if (t.id === 'palQ') { PI = 0; palRender() }
})
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'noteF') return
  e.preventDefault()
  const i = $('#noteI'), v = i.value.trim(), er = $('#noteE')
  const m = !v ? 'Nhập nội dung ghi chú.' : v.length < 4 ? 'Ghi chú quá ngắn (ít nhất 4 ký tự).' : ''
  i.setAttribute('aria-invalid', m ? 'true' : 'false'); er.textContent = m
  if (m) { i.focus(); return }
  const a = app(), b = snap(a)
  a.log.unshift({ t: now(), s: v }); renderStub(); $('#noteI').focus()
  toast('Đã thêm ghi chú vào nhật ký.', () => restore(a, b))
})
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#pal').classList.contains('on') ? closeLayer() : openPal(); return }
  if (e.key === 'Escape') { if (closeTop()) e.preventDefault(); return }
  if ($('#pal').classList.contains('on')) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); PI = (PI + (e.key === 'ArrowDown' ? 1 : -1) + PL.length) % Math.max(1, PL.length); palRender(); $(`[data-pi="${PI}"]`)?.scrollIntoView({ block: 'nearest' }) }
    if (e.key === 'Enter') { e.preventDefault(); palRun(PI) }
    return
  }
  if ($('#modal').classList.contains('on') && e.key === 'Tab') { const f = $$('#modal button, #modal input, #modal select').filter((x) => !x.disabled); const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus() } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus() } return }
  if (isTyping(e) || e.ctrlKey || e.metaKey || e.altKey || VIEW !== 'ho-so' || $('#modal').classList.contains('on')) return
  const k = e.key.toLowerCase(), inList = document.activeElement?.closest?.('#dlL')
  if (k === 'arrowdown' || k === 'arrowup') { if (inList) { e.preventDefault(); setAct(ACT + (k === 'arrowdown' ? 1 : -1), true) } return }
  if (k === 'j' || k === 'k') { const L = listApps(), i = L.findIndex((a) => a.id === SEL), n = L[Math.max(0, Math.min(L.length - 1, i + (k === 'j' ? 1 : -1)))]; if (n && n.id !== SEL) { select(n.id); $(`#lsL [data-id="${n.id}"]`)?.scrollIntoView({ block: 'nearest' }) } return }
  const row = $(`#dlL [data-j="${ACT}"]`); if (!row) return
  const map = { n: 1, b: 2, d: 3 }
  if (map[k]) { e.preventDefault(); setDoc(row.dataset.k, map[k], 'key') }
  else if (k === ' ' && inList) { e.preventDefault(); setDoc(row.dataset.k, (app().docs[row.dataset.k] || 0) === 3 ? 1 : 3, 'key') }
})
document.addEventListener('focusin', (e) => { const r = e.target.closest?.('#dlL .dl-row'); if (r && Number(r.dataset.j) !== ACT) setAct(Number(r.dataset.j)) })
document.addEventListener('pointerdown', (e) => { const r = e.target.closest('#dlL .dl-row'); if (r && !e.target.closest('button,input')) setAct(Number(r.dataset.j)) })
$('#sheet').addEventListener('pointerdown', (e) => { const s = e.target.closest('#stool'); if (s) { e.preventDefault(); DRAG = { x: e.clientX, y: e.clientY, moved: false, over: null, g: null }; document.body.style.userSelect = 'none'; s.setPointerCapture?.(e.pointerId) } })
document.addEventListener('pointermove', (e) => {
  if (DRAG) { dragMove(e); return }
  const h = e.target.closest?.('#wkH rect')
  if (h) { const w = WK[Number(h.dataset.w)]; showTip(e, `<b>Tuần ${fDM(w.t)} – ${fDM(w.t + 6 * DAY)}</b><br>${w.d} có visa · ${w.x} từ chối${w.p ? ' · ' + w.p + ' đang chờ' : ''}`); return }
  const c = e.target.closest?.('.cb-row')
  if (c && c.dataset.tip) { showTip(e, c.dataset.tip); return }
  const tip = $('#tip'); if (tip && tip.style.opacity === '1') tip.style.opacity = 0
})
document.addEventListener('pointerup', (e) => { if (DRAG) dragEnd(e) })
document.addEventListener('pointercancel', () => { if (DRAG) dragEnd(null, true) })
$('#scrim').addEventListener('click', () => { if ($('#drawer').classList.contains('on')) closeDrawer(true); else closeLayer() })
window.addEventListener('hashchange', route)
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (VIEW === 'bao-cao') drawWeeks(false) }, 120) })

/* ---------- boot ---------- */
drawGuilloche()
setTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light', false)
tick(); renderNotes()
route()
booted = true
if (!STATIC) setInterval(() => { tick(); if (VIEW === 'ho-so' && !DRAG && !document.activeElement?.closest?.('#stub')) renderStub() }, 30000)
if (ANIM && !STATIC) {
  gfrom('.hd > *:not(.gl)', { opacity: 0, y: -8, duration: 0.35, stagger: 0.04, ease: 'power2.out', clearProps: 'opacity,transform' })
  gfrom('#main .view.on .ls, #main .view.on .doc, #main .view.on .pg-h, #main .view.on .tbar, #main .view.on .tw, #main .view.on .cal, #main .view.on .ag, #main .view.on .kpis, #main .view.on .card', { opacity: 0, y: 12, duration: 0.45, stagger: 0.06, delay: 0.1, ease: 'power2.out', clearProps: 'opacity,transform' })
  gfrom('#slot .seal', { scale: 1.5, opacity: 0, duration: 0.35, delay: 0.55, ease: 'power3.in', clearProps: 'transform,opacity' })
}
</script>
